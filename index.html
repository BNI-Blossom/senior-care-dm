  <style>
    * { box-sizing: border-box; }
    :root { --forest: #2e513e; --forest-ink: #1f3a2c; --cream: #fffef3; --butter: #fff3b0; --sage: #dfeadf; --line: #d9d6b4; --muted: #4f5f55; --serif: "Noto Serif TC", "Songti TC", serif; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    html, body { margin: 0; padding: 0; }
    body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--cream); color: var(--forest-ink); -webkit-font-smoothing: antialiased; font-size: 18px; }
    h1, h2, h3 { font-family: var(--serif); margin: 0; }
    p { margin: 0; }
    a { color: var(--forest); }
    button { font-family: inherit; cursor: pointer; color: inherit; }
    :focus-visible { outline: 3px solid var(--forest); outline-offset: 3px; }
    svg[data-icon] { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .page { min-height: 100vh; display: flex; flex-direction: column; }

    /* top bar */
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--cream); border-bottom: 1.5px solid var(--forest); }
    .topbar .wrap { display: flex; align-items: center; gap: 12px; height: 68px; }
    .logo { width: 40px; height: 40px; border-radius: 50%; background: var(--forest); color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand { font-family: var(--serif); font-size: 22px; font-weight: 900; }

    /* hero */
    .hero { background: var(--forest); color: var(--cream); padding: 48px 0 56px; border-radius: 0 0 40px 40px; }
    .hero-title { font-size: clamp(40px, 8vw, 76px); line-height: 1.15; font-weight: 900; margin-bottom: 16px; }
    .hero-sub { font-size: 21px; line-height: 1.6; opacity: .92; max-width: 30em; }

    /* body: group nav + groups */
    .shell { display: grid; grid-template-columns: 1fr; gap: 0; padding-top: 8px; padding-bottom: 72px; flex: 1; }
    .groupnav { position: sticky; top: 68px; z-index: 10; display: flex; gap: 10px; overflow-x: auto; background: var(--cream); padding: 12px 0; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scrollbar-width: none; }
    .groupnav::-webkit-scrollbar { display: none; }
    .groupnav-link { flex-shrink: 0; height: 46px; padding: 0 20px; display: inline-flex; align-items: center; border-radius: 999px; border: 1.5px solid var(--forest); color: var(--forest); font-weight: 700; font-size: 17px; text-decoration: none; background: white; }
    .groupnav-link:hover { background: var(--butter); }
    .group { padding-top: 24px; }
    .group-title { font-size: 30px; font-weight: 900; margin-bottom: 14px; display: flex; align-items: baseline; gap: 12px; }
    .group-num { font-size: 18px; font-weight: 700; color: var(--forest); background: var(--butter); border-radius: 999px; padding: 2px 12px; font-family: "Noto Sans TC", sans-serif; }
    .tiles { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .tile { display: flex; align-items: center; gap: 16px; text-align: left; width: 100%; padding: 18px; background: white; border: 1.5px solid var(--forest); border-radius: 24px; transition: background .15s; font-size: inherit; }
    .tile:hover, .tile:active { background: var(--butter); }
    .icon-badge { width: 60px; height: 60px; border-radius: 50%; background: var(--butter); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--forest); }
    .tile:hover .icon-badge { background: white; }
    .tile-text { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .tile-title { font-family: var(--serif); font-size: 23px; font-weight: 900; line-height: 1.3; }
    .tile-blurb { font-size: 16px; line-height: 1.5; color: var(--muted); }
    .tile-go { width: 44px; height: 44px; border-radius: 50%; background: var(--forest); color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    @media (min-width: 900px) {
      .shell { grid-template-columns: 220px 1fr; gap: 56px; padding-top: 32px; }
      .groupnav { flex-direction: column; top: 100px; align-self: start; margin: 0; padding: 0; overflow: visible; }
      .groupnav-link { height: 54px; border-radius: 18px; font-size: 19px; }
      .group:first-child { padding-top: 0; }
      .tiles { grid-template-columns: 1fr 1fr; gap: 16px; }
      .tile { flex-direction: column; align-items: flex-start; padding: 24px; gap: 16px; min-height: 230px; }
      .tile-text { width: 100%; }
      .tile-go { align-self: flex-end; margin-top: auto; }
    }

    .site-footer { background: var(--forest); color: var(--cream); padding: 40px 0; }
    .site-footer .brand { margin-bottom: 6px; }
    .site-footer p { font-size: 16px; opacity: .85; }

    /* detail sheet */
    .sheet { position: fixed; inset: 0; z-index: 50; background: var(--cream); display: flex; flex-direction: column; }
    .sheet-top { border-bottom: 1.5px solid var(--forest); flex-shrink: 0; }
    .sheet-top .wrap { height: 68px; display: flex; align-items: center; }
    .back { display: flex; align-items: center; gap: 6px; background: none; border: none; font-size: 19px; font-weight: 700; min-height: 48px; padding: 0 12px 0 0; }
    .sheet-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .sheet-inner { max-width: 720px; margin: 0 auto; padding: 32px 20px 40px; }
    .detail-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--butter); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: var(--forest); }
    .detail-title { font-size: clamp(34px, 7vw, 52px); font-weight: 900; line-height: 1.2; margin-bottom: 20px; }
    .intro { border-left: 5px solid var(--forest); padding-left: 18px; font-size: 20px; line-height: 1.8; margin-bottom: 32px; text-wrap: pretty; }
    .label { display: inline-block; background: var(--butter); color: var(--forest); font-weight: 700; font-size: 15px; padding: 4px 14px; border-radius: 999px; margin-bottom: 14px; }
    .provider { background: white; border: 1.5px solid var(--forest); border-radius: 28px; overflow: hidden; margin-bottom: 20px; }
    .provider-text { padding: 24px 24px 20px; }
    .provider-name { font-size: 26px; font-weight: 900; line-height: 1.35; }
    .provider-pitch { font-size: 18px; line-height: 1.75; color: var(--muted); margin-top: 10px; text-wrap: pretty; }
    .service-img { width: 100%; height: auto; display: block; }
    .contact-section { background: var(--butter); border-radius: 28px; padding: 28px; text-align: center; margin-top: 28px; }
    .contact-section h3 { font-size: 24px; font-weight: 900; margin-bottom: 14px; }
    .contact-btn { width: 100%; height: 56px; border-radius: 999px; border: 1.5px solid var(--forest); background: white; color: var(--forest); font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; }

    .actionbar { flex-shrink: 0; background: white; border-top: 1.5px solid var(--forest); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
    .actionbar .wrap { max-width: 720px; display: flex; gap: 10px; flex-wrap: wrap; }
    .act { flex: 1 1 200px; height: 60px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 19px; font-weight: 700; text-decoration: none; border: 1.5px solid var(--forest); }
    .act-solid { background: var(--forest); color: white; }
    .act-solid:hover { background: var(--forest-ink); color: white; }
    .act-line { background: #06c755; border-color: #06c755; color: white; }
    .act-outline { background: white; color: var(--forest); }
    .act svg { flex-shrink: 0; }
  </style>
</helmet>

<div class="page">

  <header class="topbar">
    <div class="wrap">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4-3-8-6.5-8-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4.5-4 8-8 11z"></path></svg>
      </div>
      <div class="brand">銀髮服務導航</div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1 class="hero-title">家裡長輩<br>需要什麼協助？</h1>
      <p class="hero-sub">選一個項目，直接打電話或加 LINE，聯絡專人詢問。</p>
    </div>
  </section>

  <main class="wrap shell">
    <nav class="groupnav" aria-label="服務分類">
      <sc-for list="{{ groups }}" as="g">
        <a href="{{ g.href }}" class="groupnav-link">{{ g.title }}</a>
      </sc-for>
    </nav>

    <div>
      <sc-for list="{{ groups }}" as="g">
        <section class="group" id="{{ g.anchor }}">
          <h2 class="group-title"><span class="group-num">{{ g.num }}</span>{{ g.title }}</h2>
          <div class="tiles">
            <sc-for list="{{ g.items }}" as="t">
              <button class="tile" onClick="{{ t.open }}">
                <span class="icon-badge"><svg data-icon="{{ t.id }}" width="30" height="30" viewBox="0 0 24 24"></svg></span>
                <span class="tile-text">
                  <span class="tile-title">{{ t.title }}</span>
                  <span class="tile-blurb">{{ t.blurb }}</span>
                </span>
                <span class="tile-go"><svg data-icon="arrow" width="22" height="22" viewBox="0 0 24 24"></svg></span>
              </button>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="brand">銀髮服務導航</div>
      <p>協助家庭找到安心的長者照護、健康與財務服務</p>
    </div>
  </footer>

  <!-- DETAIL SHEET -->
  <sc-if value="{{ hasDetail }}" hint-placeholder-val="{{ false }}">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="{{ detail.title }}">
      <div class="sheet-top">
        <div class="wrap" style="max-width: 720px;">
          <button class="back" onClick="{{ close }}">
            <svg data-icon="back" width="26" height="26" viewBox="0 0 24 24"></svg>
            返回
          </button>
        </div>
      </div>

      <div class="sheet-scroll">
        <div class="sheet-inner">
          <div class="detail-icon"><svg data-icon="{{ detail.id }}" width="36" height="36" viewBox="0 0 24 24"></svg></div>
          <h1 class="detail-title">{{ detail.title }}</h1>
          <p class="intro">{{ detail.intro }}</p>

          <div class="label">精選服務</div>
          <sc-for list="{{ detail.providers }}" as="p">
            <article class="provider">
              <div class="provider-text">
                <h2 class="provider-name">{{ p.name }}</h2>
                <sc-if value="{{ p.pitch }}" hint-placeholder-val="{{ false }}">
                  <p class="provider-pitch">{{ p.pitch }}</p>
                </sc-if>
              </div>
              <sc-for list="{{ p.imgs }}" as="im">
                <img src="{{ im.src }}" alt="{{ im.alt }}" width="{{ im.w }}" height="{{ im.h }}" class="service-img">
              </sc-for>
            </article>
          </sc-for>

          <section class="contact-section">
            <h3>有其他問題？</h3>
            <a href="https://lin.ee/95a4T6s" target="_blank" rel="noopener noreferrer" class="contact-btn">聯絡銀髮服務導航</a>
          </section>
        </div>
      </div>

      <div class="actionbar">
        <div class="wrap">
          <sc-for list="{{ detail.actions }}" as="a">
            <a href="{{ a.href }}" target="{{ a.target }}" rel="noopener noreferrer" class="{{ a.cls }}">
              <svg data-icon="{{ a.icon }}" width="24" height="24" viewBox="0 0 24 24"></svg>
              {{ a.label }}
            </a>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

</div>

  actionStyle = { tel: 'act act-solid', apple: 'act act-solid', line: 'act act-line', android: 'act act-outline' };

  componentDidMount() {
    document.addEventListener('click', this.trackClick);
    document.addEventListener('keydown', this.onKey);
    window.addEventListener('popstate', this.onPop);
    this.fillIcons();
  }

  componentDidUpdate() {
    this.fillIcons();
    document.body.style.overflow = this.state.openId ? 'hidden' : '';
    if (this.state.openId !== this.lastOpen) {
      this.lastOpen = this.state.openId;
      const el = document.querySelector(this.state.openId ? '.back' : '.tile');
      if (this.state.openId && el) el.focus();
    }
  }

  componentWillUnmount() {
    document.removeEventListener('click', this.trackClick);
    document.removeEventListener('keydown', this.onKey);
    window.removeEventListener('popstate', this.onPop);
  }

  // The template can't inject raw SVG, so icons are filled in after each render.
  fillIcons() {
    const all = Object.assign({ back: '<path d="M15 18l-6-6 6-6"></path>' }, this.icons);
    document.querySelectorAll('svg[data-icon]').forEach((el) => {
      const key = el.getAttribute('data-icon');
      if (el.dataset.filled !== key && all[key]) {
        el.innerHTML = all[key];
        el.dataset.filled = key;
      }
    });
  }

  trackClick = (e) => {
    if (typeof gtag !== 'function') return;
    const el = e.target.closest('a, button');
    if (!el) return;
    const label = (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 100);
    gtag('event', 'click', {
      event_category: 'engagement',
      event_label: label,
      screen: this.state.openId || 'home',
    });
  };

  onKey = (e) => { if (e.key === 'Escape' && this.state.openId) this.close(); };
  onPop = (e) => this.setState({ openId: (e.state && e.state.o) || null });

  openService = (id) => {
    history.pushState({ o: id }, '');
    this.setState({ openId: id });
  };

  close = () => {
    if (history.state && history.state.o) history.back();
    else this.setState({ openId: null });
  };

  renderVals() {
    const groups = this.groupDefs.map((g, i) => ({
      anchor: g.anchor,
      href: '#' + g.anchor,
      title: g.title,
      num: '0' + (i + 1),
      items: g.ids.map((id) => ({
        id, title: this.services[id].title, blurb: this.services[id].blurb,
        open: () => this.openService(id),
      })),
    }));

    const id = this.state.openId;
    const svc = id && this.services[id];
    const detail = svc
      ? Object.assign({ id }, svc, {
          actions: svc.actions.map((a) => ({
            href: a.href, label: a.label, icon: a.kind === 'tel' ? 'phone' : a.kind,
            cls: this.actionStyle[a.kind], target: a.kind === 'tel' ? '_self' : '_blank',
          })),
        })
      : { id: '', title: '', intro: '', providers: [], actions: [] };

    return { groups, hasDetail: !!svc, detail, close: this.close };
  }
}
